<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Anggota Perpustakaan Keliling</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      padding: 20px;
      background: #e0e0e0;
    }
    
    /* Kontrol di web (tidak ikut cetak) */
    .controls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .controls label {
      font-weight: bold;
      font-size: 16px;
    }
    
    .controls select {
      padding: 8px 15px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    
    .controls button {
      padding: 8px 20px;
      font-size: 14px;
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .controls button:hover {
      background: #1a252f;
    }
    
    .print-btn {
      background: #27ae60 !important;
    }
    
    .print-btn:hover {
      background: #1e8449 !important;
    }
    
    .info {
      background: #ecf0f1;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
    }
    
    /* LAYOUT KARTU DI WEB (sama seperti cetak) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 54mm);
      justify-content: center;
      gap: 5px;
      background: white;
      padding: 5px;
      border-radius: 20px;
    }
    
    /* Warna per RT */
    .bg-rt01 { background: linear-gradient(135deg, #3498db, #2980b9); }
    .bg-rt02 { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    .bg-rt03 { background: linear-gradient(135deg, #FFD700, #D4AC0D); }
    .bg-rt04 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
    .bg-rt05 { background: linear-gradient(135deg, #FF00AA, #C51162); }
    .bg-rt06 { background: linear-gradient(135deg, #e67e22, #d35400); }
    .bg-rt07 { background: linear-gradient(135deg, #9B59B6, #6C3483); }
    .bg-rt08 { background: linear-gradient(135deg, #00E5FF, #0097A7); }
    .bg-rt09 { background: linear-gradient(135deg, #85E085, #28A745); }
    .bg-rt10 { background: linear-gradient(135deg, #A0522D, #6E3B1F); }
    .bg-rt11 { background: linear-gradient(135deg, #3F51B5, #1A237E); }
    .bg-rt12 { background: linear-gradient(135deg, #FFB74D, #FB8C00); }
    .bg-rt13 { background: linear-gradient(135deg, #A3E635, #65A30D); }
    .bg-rt14 { background: linear-gradient(135deg, #26A69A, #00695C); }
    .bg-rt15 { background: linear-gradient(135deg, #556B2F, #2F4F1F); }
    
    /* Kartu utama */
    .card {
      width: 54mm;
      height: 86mm;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    
    /* Efek bintang */
    .card::before {
      content: "✦ ✦ ✦";
      position: absolute;
      top: 5px;
      left: 0;
      right: 0;
      font-size: 10px;
      opacity: 0.25;
      letter-spacing: 5px;
    }
    
    .header {
      background: rgba(255,255,255,0.2);
      padding: 6px 0;
      margin-top: 12px;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .badge {
      background: rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 5px 10px;
      margin: 10px auto;
      width: fit-content;
      font-size: 13px;
      font-weight: bold;
      font-family: monospace;
    }
    
    .nama {
      font-size: 14px;
      font-weight: bold;
      margin: 12px 10px;
      background: rgba(0,0,0,0.15);
      padding: 6px;
      border-radius: 8px;
      word-wrap: break-word;
    }
    
    .rt {
      font-size: 11px;
      margin: 8px 0;
      background: rgba(255,255,255,0.2);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
    }
    
    .footer {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      font-size: 7px;
      opacity: 0.7;
    }
    
    .emoji {
      font-size: 28px;
      margin-top: 5px;
    }
    
    /* ========== ATURAN CETAK PDF (4x4, margin kecil) ========== */
    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      
      .controls {
        display: none !important;
      }
      
      .card-grid {
        display: grid !important;
        grid-template-columns: repeat(4, 54mm) !important;
        justify-content: center !important;
        gap: 5px !important;
        padding: 0 !important;
        margin: 0 auto !important;
        background: white;
      }
      
      .card {
        box-shadow: none;
        border: 0.5px solid #ddd;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      
      /* Paksa warna background */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      
      /* Margin kertas: atas, kanan, bawah, kiri */
      @page {
        size: A4;
        margin: 0.3cm;
      }
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
      color: #2c3e50;
    }
    
    .no-data {
      text-align: center;
      padding: 50px;
      font-size: 16px;
      color: #999;
    }
  </style>
</head>
<body>

<div class="controls">
  <label>📦 Pilih Batch:</label>
  <select id="batchSelect">
    <option value="Batch-1">Batch 1</option>
    <option value="Batch-2">Batch 2</option>
    <option value="Batch-3">Batch 3</option>
    <option value="Batch-4">Batch 4</option>
  </select>
  <button onclick="loadData()">📋 Tampilkan Kartu</button>
  <button class="print-btn" onclick="window.print()">🖨️ Cetak PDF (4x4 per halaman)</button>
  <div class="info" id="infoPanel">Belum ada data</div>
</div>

<div id="kartuContainer" class="card-grid">
  <div class="loading">Pilih batch dan klik "Tampilkan Kartu"</div>
</div>

<script>
  // GANTI DENGAN URL SHEETDB ANDA!
  const API_URL = 'https://sheetdb.io/api/v1/cyxun7dlxc9vt';
  
  function getEmoji(rt) {
    const emojiMap = {
      'RT01': '🦁', 'RT02': '🐘', 'RT03': '🦒', 'RT04': '🦓',
      'RT05': '🐿️', 'RT06': '🦌', 'RT07': '🐼', 'RT08': '🐧',
      'RT09': '🦉', 'RT10': '🐢', 'RT11': '🦋', 'RT12': '🐟',
      'RT13': '🐬', 'RT14': '🦚', 'RT15': '🐝'
    };
    return emojiMap[rt] || '📚';
  }
  
  let semuaData = [];
  
  async function fetchData() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();
      semuaData = data;
      return data;
    } catch (error) {
      console.error('Gagal mengambil data:', error);
      return [];
    }
  }
  
  function renderCards(anakList) {
    const container = document.getElementById('kartuContainer');
    const infoPanel = document.getElementById('infoPanel');
    
    if (!anakList || anakList.length === 0) {
      container.innerHTML = '<div class="no-data">⚠️ Tidak ada data untuk batch ini</div>';
      infoPanel.innerHTML = 'Jumlah kartu: 0';
      return;
    }
    
    anakList.sort((a, b) => a.RT.localeCompare(b.RT));
    
    let html = '';
    for (const anak of anakList) {
      const rt = anak.RT;
      const kelasWarna = `bg-${rt.toLowerCase()}`;
      const emoji = getEmoji(rt);
      
      html += `
        <div class="card ${kelasWarna}">
          <div class="header">⭐ PERPUS KELILING ⭐</div>
          <div class="emoji">${emoji}</div>
          <div class="badge">${anak.ID}</div>
          <div class="nama">${anak.Nama}</div>
          <div class="rt">📍 ${anak.RT}</div>
          <div class="footer">#RajinMembaca</div>
        </div>
      `;
    }
    
    container.innerHTML = html;
    infoPanel.innerHTML = `✅ Jumlah kartu: ${anakList.length} kartu (siap cetak 4x4 per halaman)`;
  }
  
  async function loadData() {
    const batch = document.getElementById('batchSelect').value;
    const container = document.getElementById('kartuContainer');
    container.innerHTML = '<div class="loading">🔄 Memuat data...</div>';
    
    let data = semuaData;
    if (data.length === 0) {
      data = await fetchData();
    }
    
    const filtered = data.filter(item => item.Batch === batch);
    console.log('Batch:', batch, 'Jumlah:', filtered.length);
    renderCards(filtered);
  }
  
  window.addEventListener('DOMContentLoaded', () => {
    loadData();
  });
</script>

</body>
</html>
