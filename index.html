<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda - Perpustakaan Keliling RW</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e8f4f8 0%, #d1e8f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .home-container {
      max-width: 800px;
      width: 100%;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #2c3e50, #1a252f);
      color: white;
      padding: 35px 25px;
      border-radius: 25px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .header .subtitle {
      opacity: 0.85;
      font-size: 14px;
    }
    
    .header .rw-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 5px 15px;
      border-radius: 20px;
      margin-top: 15px;
      font-size: 12px;
    }
    
    /* Menu Cards */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }
    
    .menu-card {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-decoration: none;
      display: block;
    }
    
    .menu-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    
    .menu-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    
    .menu-card h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }
    
    .menu-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .menu-card.kehadiran {
      border-bottom: 5px solid #27ae60;
    }
    
    .menu-card.kehadiran:hover {
      border-bottom-color: #219a52;
    }
    
    .menu-card.cetak {
      border-bottom: 5px solid #2980b9;
    }
    
    .menu-card.cetak:hover {
      border-bottom-color: #1c638e;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #5a6e7c;
      font-size: 12px;
    }
    
    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .header h1 {
        font-size: 22px;
      }
      .menu-icon {
        font-size: 48px;
      }
      .menu-card h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="header">
      <h1>📚 PERPUSTAKAAN KELILING</h1>
      <div class="subtitle">Sistem Informasi Anggota Berbasis Web</div>
      <div class="rw-badge">🏘️ RW.08 - Perumahan Asri</div>
    </div>
    
    <div class="menu-grid">
      <a href="hadir.html" class="menu-card kehadiran">
        <div class="menu-icon">📝</div>
        <h2>Input Kehadiran</h2>
        <p>Catat jumlah anak yang hadir<br>setiap hari Sabtu per RT</p>
      </a>
      
      <a href="cetak.html" class="menu-card cetak">
        <div class="menu-icon">🖨️</div>
        <h2>Cetak Kartu Anggota</h2>
        <p>Generate dan cetak kartu anggota<br>berdasarkan batch pendaftaran</p>
      </a>
    </div>
    
    <div class="footer">
      <p>© 2026 - Tim KKN Perpustakaan Keliling</p>
    </div>
  </div>
</body>
</html>
